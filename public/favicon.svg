<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="20%" stop-color="#ede8dc"/>
      <stop offset="38%" stop-color="#f4d59e"/>
      <stop offset="50%" stop-color="#e879c8"/>
      <stop offset="62%" stop-color="#a8d0e6"/>
      <stop offset="80%" stop-color="#ede8dc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#05060a"/>
  
  <!-- Central orb -->
  <circle cx="16" cy="16" r="10" fill="url(#aurora)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Outer ring dots representing categories -->
  <g fill="#ede8dc" opacity="0.7">
    <circle cx="16" cy="4" r="1.5"/>
    <circle cx="28" cy="10" r="1.5" fill="#FFB347"/>
    <circle cx="30" cy="22" r="1.5" fill="#7DD87D"/>
    <circle cx="22" cy="29" r="1.5" fill="#E879C8"/>
    <circle cx="10" cy="29" r="1.5" fill="#8FBC8F"/>
    <circle cx="2" cy="22" r="1.5" fill="#A8D0E6"/>
    <circle cx="4" cy="10" r="1.5" fill="#F4D59E"/>
  </g>
  
  <!-- Connection lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.3">
    <line x1="16" y1="16" x2="16" y2="4"/>
    <line x1="16" y1="16" x2="28" y2="10"/>
    <line x1="16" y1="16" x2="30" y2="22"/>
    <line x1="16" y1="16" x2="22" y2="29"/>
    <line x1="16" y1="16" x2="10" y2="29"/>
    <line x1="16" y1="16" x2="2" y2="22"/>
    <line x1="16" y1="16" x2="4" y2="10"/>
  </g>
</svg>